<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogging App - Menu Board</title>
</head>
<body>
    <div align="center">
        <div style="width: 800px; border: 1px solid black;">
            <!-- Header -->
            <div style="background-color: #f0f0f0; height: 50px; border-bottom: 1px solid black; text-align: center;">
                <font size="5">Blogging App</font>
            </div>
            
            <!-- Main Content Area -->
            <div style="display: flex;">
                <!-- Menu Navigation -->
                <div style="width: 200px; border-right: 1px solid black;">
                    <form action="" method="post">
                        <div style="background-color: #e9e9e9; height: 40px; text-align: left; padding-left: 10px; display: flex; align-items: center;">
                            <input type="submit" name="action" value="My Blogs" style="background: none; border: none; color: #333; cursor: pointer; text-align: left; width: 100%;">
                        </div>
                        <div style="height: 40px; text-align: left; padding-left: 10px; display: flex; align-items: center;">
                            <input type="submit" name="action" value="All Blogs" style="background: none; border: none; color: #333; cursor: pointer; text-align: left; width: 100%;">
                        </div>
                        <div style="background-color: #e9e9e9; height: 40px; text-align: left; padding-left: 10px; display: flex; align-items: center;">
                            <input type="submit" name="action" value="Add Category" style="background: none; border: none; color: #333; cursor: pointer; text-align: left; width: 100%;">
                        </div>
                        <div style="height: 40px; text-align: left; padding-left: 10px; display: flex; align-items: center;">
                            <input type="submit" name="action" value="Show Categories" style="background: none; border: none; color: #333; cursor: pointer; text-align: left; width: 100%;">
                        </div>
                        <div style="background-color: #e9e9e9; height: 40px; text-align: left; padding-left: 10px; display: flex; align-items: center;">
                            <input type="submit" name="action" value="Add Blog" style="background: none; border: none; color: #333; cursor: pointer; text-align: left; width: 100%;">
                        </div>
                        <div style="height: 40px; text-align: left; padding-left: 10px; display: flex; align-items: center;">
                            <input type="submit" name="action" value="Search Blogs" style="background: none; border: none; color: #333; cursor: pointer; text-align: left; width: 100%;">
                        </div>
                        <div style="background-color: #e9e9e9; height: 40px; text-align: left; padding-left: 10px; display: flex; align-items: center;">
                            <input type="submit" name="action" value="Logout" style="background: none; border: none; color: #333; cursor: pointer; text-align: left; width: 100%;">
                        </div>
                    </form>
                </div>
                
                <!-- Content Area -->
                <div style="width: 600px; height: 400px; text-align: center;">
                    <div style="padding: 20px;">
                        <h3>Welcome to your Blogging Dashboard</h3>
                        <p>Select an option from the menu to get started</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
